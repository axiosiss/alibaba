<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ali Baba | Boutique VIP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background: #ffffff; font-family: 'Segoe UI', sans-serif; color: #333; }
        .card-vip { background: #fffcf9; border-radius: 15px; border: 1px solid #ffe8d9; }
        .btn-buy { background: #ff6a00; color: white; border-radius: 8px; font-weight: bold; transition: 0.3s; }
        .btn-buy:active { transform: scale(0.95); opacity: 0.8; }
        .stats-header { background: #ff6a00; border-radius: 12px; color: white; }
        .active-badge { background: #22c55e; color: white; padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 900; position: absolute; top: 10px; right: 10px; }
    </style>
</head>
<body class="pb-32">

    <div class="w-full h-44 overflow-hidden shadow-sm">
        <img src="IMG_3923.jpeg" class="w-full h-full object-cover">
    </div>

    <div class="px-4 mt-4">
        <div class="stats-header p-4 flex items-center justify-between shadow-lg">
            <div class="flex items-center">
                <img src="IMG_3923.jpeg" class="w-12 h-12 rounded-lg object-cover mr-3 border-2 border-white">
                <div class="text-left">
                    <p id="userBalance" class="font-black text-lg italic">FC ...</p>
                    <p class="text-[9px] uppercase font-bold opacity-80">Mon Solde</p>
                </div>
            </div>
            <a href="mes_vip.html" class="text-right block active:opacity-70">
                <p id="userVipCount" class="font-black text-lg italic">0</p>
                <p class="text-[9px] uppercase font-bold opacity-80 underline underline-offset-2">Mes VIP Actifs</p>
            </a>
        </div>
    </div>

    <div id="myInvestmentSection" class="hidden px-4 mt-6">
        <h2 class="text-xs font-black uppercase text-slate-400 mb-3 ml-1 italic border-l-4 border-[#ff6a00] pl-2">Mes équipements loués</h2>
        <div id="activeVipDisplay" class="space-y-3"></div>
    </div>

    <div id="vipList" class="px-4 mt-6 space-y-4"></div>

    <nav class="fixed bottom-0 left-0 right-0 bg-white p-4 flex justify-around items-center z-50 shadow-inner">
        <a href="dashboard.html" class="flex flex-col items-center text-slate-300">
            <i class="fa-solid fa-house text-xl"></i>
            <span class="text-[9px] font-bold mt-1 uppercase">Maison</span>
        </a>
        <a href="produit.html" class="flex flex-col items-center text-[#ff6a00]">
            <i class="fa-solid fa-bag-shopping text-xl"></i>
            <span class="text-[9px] font-bold mt-1 uppercase">Produit</span>
        </a>
        <a href="equipe.html" class="flex flex-col items-center text-slate-300">
            <i class="fa-solid fa-users text-xl"></i>
            <span class="text-[9px] font-bold mt-1 uppercase">Équipe</span>
        </a>
        <a href="compte.html" class="flex flex-col items-center text-slate-300">
            <i class="fa-solid fa-user text-xl"></i>
            <span class="text-[9px] font-bold mt-1 uppercase">Le mien</span>
        </a>
    </nav>

    <script>
        const DB_URL = "https://alibaba-f22a0-default-rtdb.firebaseio.com/users";
        const userPhone = localStorage.getItem('userPhone');

        const vips = [
            { id: 1, prix: 20000, jour: 5200, img: "IMG_3928.jpeg" },
            { id: 2, prix: 50000, jour: 13500, img: "IMG_3929.jpeg" },
            { id: 3, prix: 75000, jour: 19000, img: "IMG_3930.jpeg" },
            { id: 4, prix: 100000, jour: 28000, img: "IMG_3931.jpeg" },
            { id: 5, prix: 150000, jour: 42000, img: "IMG_3932.jpeg" },
            { id: 6, prix: 280000, jour: 77000, img: "IMG_3933.jpeg" },
            { id: 7, prix: 400000, jour: 96000, img: "IMG_3934.jpeg" },
            { id: 8, prix: 700000, jour: 148000, img: "IMG_3935.jpeg" },
            { id: 9, prix: 1000000, jour: 258000, img: "IMG_3936.jpeg" },
            { id: 10, prix: 3000000, jour: 950000, img: "IMG_3937.jpeg" },
            { id: 11, prix: 7500000, jour: 1850000, img: "IMG_3938.jpeg" },
            { id: 12, prix: 10200000, jour: 2500000, img: "IMG_3939.jpeg" }
        ];

        async function fetchInfo() {
            if (!userPhone) return window.location.href = "index.html";
            const res = await fetch(`${DB_URL}/${userPhone}.json`);
            const data = await res.json();
            
            // Nouveau système : on lit le dossier investissements
            const investments = data.investissements || {};
            const vipCount = Object.keys(investments).length;
            
            document.getElementById('userBalance').innerText = `FC ${(data.balance || 0).toLocaleString()}`;
            document.getElementById('userVipCount').innerText = vipCount;
            
            renderProducts(data.balance || 0, investments);
        }

        function renderProducts(currentBalance, investments) {
            const list = document.getElementById('vipList');
            
            // Compter combien de fois chaque VIP est possédé
            const ownedVipsCount = {};
            Object.values(investments).forEach(inv => {
                ownedVipsCount[inv.vipId] = (ownedVipsCount[inv.vipId] || 0) + 1;
            });

            list.innerHTML = vips.map(v => {
                const count = ownedVipsCount[v.id] || 0;
                const badge = count > 0 ? `<span class="active-badge italic">POSSÉDÉ (x${count})</span>` : '';
                
                return `
                <div class="card-vip p-3 flex gap-4 items-center shadow-md relative">
                    ${badge}
                    <div class="w-1/3 h-24 overflow-hidden rounded-lg">
                        <img src="${v.img}" class="w-full h-full object-cover">
                    </div>
                    <div class="w-2/3">
                        <h3 class="text-sm font-black text-[#ff6a00] uppercase italic">VIP ${v.id}</h3>
                        <p class="text-[10px] font-bold text-slate-700">Prix: FC ${v.prix.toLocaleString()}</p>
                        <p class="text-[10px] font-bold text-orange-600">Gain/Jour: FC ${v.jour.toLocaleString()}</p>
                        <button onclick="validerAchat(${v.id}, ${v.prix})" class="btn-buy mt-2 w-full py-2 text-[10px] uppercase">
                            Acheter
                        </button>
                    </div>
                </div>
                `;
            }).join('');

            // Affichage des VIP achetés en haut
            const invArray = Object.values(investments);
            if (invArray.length > 0) {
                const section = document.getElementById('myInvestmentSection');
                section.classList.remove('hidden');
                
                document.getElementById('activeVipDisplay').innerHTML = invArray.map(inv => {
                    const myVip = vips.find(v => v.id == inv.vipId);
                    return `
                        <div class="bg-slate-900 p-4 rounded-2xl flex items-center gap-4 text-white shadow-xl">
                            <img src="${myVip.img}" class="w-16 h-16 rounded-xl object-cover border-2 border-green-500">
                            <div>
                                <h3 class="text-lg font-black italic text-green-400">VIP ${myVip.id}</h3>
                                <p class="text-[10px] opacity-80 font-bold italic">Production : FC ${myVip.jour.toLocaleString()} / jour</p>
                            </div>
                        </div>
                    `;
                }).join('');
            }
        }

        async function validerAchat(id, prix) {
            // On récupère le solde à la seconde de l'achat pour éviter les erreurs
            const res = await fetch(`${DB_URL}/${userPhone}.json`);
            const user = await res.json();
            const balance = user.balance || 0;

            if (balance < prix) return alert("Solde insuffisant ! Veuillez recharger votre compte.");
            if (!confirm(`Confirmer l'achat du VIP ${id} pour FC ${prix.toLocaleString()} ?`)) return;

            try {
                const now = Date.now(); 
                const invId = "inv_" + now; // Identifiant unique pour cet achat
                const nouveauSolde = balance - prix;

                // On prépare les données à envoyer
                const updates = {
                    balance: nouveauSolde,
                    [`investissements/${invId}`]: {
                        vipId: id,
                        lastHarvest: now // Départ du chrono pour CE produit
                    }
                };

                await fetch(`${DB_URL}/${userPhone}.json`, {
                    method: 'PATCH',
                    body: JSON.stringify(updates)
                });

                // Commissions
                if (user.referredBy && user.referredBy !== "DIRECT") {
                    await distribuerCommission(user.referredBy, prix * 0.35);
                    const p1Res = await fetch(`${DB_URL}/${user.referredBy}.json`);
                    const p1 = await p1Res.json();
                    if (p1 && p1.referredBy && p1.referredBy !== "DIRECT") {
                        await distribuerCommission(p1.referredBy, prix * 0.02);
                        const p2Res = await fetch(`${DB_URL}/${p1.referredBy}.json`);
                        const p2 = await p2Res.json();
                        if (p2 && p2.referredBy && p2.referredBy !== "DIRECT") {
                            await distribuerCommission(p2.referredBy, prix * 0.01);
                        }
                    }
                }

                alert("Achat réussi ! Votre cycle de 24h a démarré pour ce produit.");
                location.reload();
            } catch (e) { alert("Erreur lors de la transaction."); }
        }

        async function distribuerCommission(phone, montant) {
            try {
                const res = await fetch(`${DB_URL}/${phone}.json`);
                const data = await res.json();
                if (data) {
                    await fetch(`${DB_URL}/${phone}.json`, {
                        method: 'PATCH',
                        body: JSON.stringify({ balance: (data.balance || 0) + montant })
                    });
                }
            } catch (e) { console.error("Erreur commission", e); }
        }

        window.onload = fetchInfo;
    </script>
</body>
</html>
